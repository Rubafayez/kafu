# إعدادات النشر على Netlify: الواجهة ملفات ثابتة من dist، ومسارات /api دالة واحدة
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# طلبات الذكاء الاصطناعي تذهب للدالة
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# أي مسار آخر يفتح التطبيق نفسه
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
